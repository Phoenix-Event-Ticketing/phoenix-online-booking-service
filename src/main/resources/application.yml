spring:
  application:
    name: ${APP_NAME:phoenix-online-booking-service}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/booking_db}
      database: ${MONGODB_DATABASE:booking_db}

server:
  port: ${APP_PORT:8083}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  env: ${APP_ENV:dev}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://dev.phoenix-project.online,http://localhost:3000}

security:
  jwt:
    secret: ${JWT_SECRET:replace_with_a_minimum_32_character_secret}
    issuer: ${JWT_ISSUER:phoenix-online-auth}
  internal:
    service-id: ${INTERNAL_SERVICE_ID:booking-service}
    service-token-ttl-seconds: ${INTERNAL_SERVICE_TOKEN_TTL_SECONDS:300}
    # JSON: {"service-id":["PERM1","PERM2"],...} - no secrets, permission-based authz.
    # Set via INTERNAL_SERVICE_PERMISSIONS_JSON or SECURITY_INTERNAL_SERVICE_PERMISSIONS_JSON.

services:
  booking:
    callback-base-url: ${BOOKING_SERVICE_CALLBACK_BASE_URL:http://localhost:8083}
  event:
    base-url: ${EVENT_SERVICE_BASE_URL:http://localhost:8081}
  inventory:
    base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}

booking:
  payment-timeout-minutes: ${BOOKING_PAYMENT_TIMEOUT_MINUTES:15}
  expiry-scan-interval-ms: ${BOOKING_EXPIRY_SCAN_INTERVAL_MS:60000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      service: ${OTEL_SERVICE_NAME:booking-service}
  otlp:
    tracing:
      endpoint: ${JAEGER_ENDPOINT:http://jaeger-collector:4318/v1/traces}

info:
  app:
    name: ${APP_NAME:phoenix-online-booking-service}
    description: Booking Service for Phoenix Online microservice application
    version: 1.0.0
