name: Docker Publish

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/phoenix-online-booking-service
            asia-south1-docker.pkg.dev/phoenix-event-booking/phoenix-images/booking-service
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ github.ref_name }}-latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update GitOps tag for dev
        if: github.ref_name == 'dev'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/Phoenix-Event-Ticketing/phoenix-online-platform-config.git" gitops
          cd gitops

          TARGET_FILE="apps/booking-service/overlays/dev/kustomization.yaml"
          sed -i -E "s#(^[[:space:]]*newTag:[[:space:]]*).*$#\1${IMAGE_TAG}#" "${TARGET_FILE}"

          if git diff --quiet -- "${TARGET_FILE}"; then
            echo "No GitOps changes detected for dev"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET_FILE}"
          git commit -m "chore(gitops): update booking-service dev image tag to ${IMAGE_TAG}"
          git push origin main

      - name: Update GitOps tag for prod
        if: github.ref_name == 'main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/Phoenix-Event-Ticketing/phoenix-online-platform-config.git" gitops
          cd gitops

          TARGET_FILE="apps/booking-service/overlays/prod/kustomization.yaml"
          sed -i -E "s#(^[[:space:]]*newTag:[[:space:]]*).*$#\1${IMAGE_TAG}#" "${TARGET_FILE}"

          if git diff --quiet -- "${TARGET_FILE}"; then
            echo "No GitOps changes detected for prod"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET_FILE}"
          git commit -m "chore(gitops): update booking-service prod image tag to ${IMAGE_TAG}"
          git push origin main
